<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winter Training Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700&family=Source+Sans+3:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%278%27 fill=%27%237A431D%27/%3E%3Cg fill=%27%23FBF7F0%27%3E%3Cellipse cx=%2720%27 cy=%2725%27 rx=%277%27 ry=%276%27/%3E%3Cellipse cx=%2712%27 cy=%2717%27 rx=%273%27 ry=%273.6%27/%3E%3Cellipse cx=%2717.5%27 cy=%2712%27 rx=%273%27 ry=%273.6%27/%3E%3Cellipse cx=%2722.5%27 cy=%2712%27 rx=%273%27 ry=%273.6%27/%3E%3Cellipse cx=%2728%27 cy=%2717%27 rx=%273%27 ry=%273.6%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>
<div class="app">
<header><div class="wrap hd">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="8" fill="#7A431D"/><g fill="#FBF7F0"><ellipse cx="20" cy="25" rx="7" ry="6"/><ellipse cx="12" cy="17" rx="3" ry="3.6"/><ellipse cx="17.5" cy="12" rx="3" ry="3.6"/><ellipse cx="22.5" cy="12" rx="3" ry="3.6"/><ellipse cx="28" cy="17" rx="3" ry="3.6"/></g></svg>
    <h1>Winter Training</h1>
  </div>
  <label class="dog" for="dogname"><span class="pip" id="pip">S</span><input id="dogname" value="Sunny" aria-label="Your dog's name" maxlength="16"></label>
  <button class="btn btn2" id="printbtn" type="button">Printable sheet</button>
</div></header>
<main class="wrap">
  <nav class="tracks" id="tracks" aria-label="Pick this week's theme"></nav>
  <section class="intro">
    <div><span class="lab wk">This week's theme · 5 days · 15 minutes a day</span><h2 id="tname"></h2><p id="tblurb"></p></div>
  </section>
  <div class="days" id="days" role="group" aria-label="Days"></div>
  <div class="main">
    <article class="card drill" id="drill"></article>
    <div class="side"><section class="card bonus" id="bonus"></section><section class="card gear" id="gear"></section></div>
  </div>
</main>
</div>
<div class="sbar no-print"><button class="btn btn1" id="doprint" type="button">Print this sheet</button><button class="btn btn2" id="back" type="button">Back to planner</button><span class="small" style="align-self:center">If printing is blocked here, download the page and print it from your browser.</span></div>
<section class="sheet printable-page-container" id="sheet"></section>
<script src="js/app.js" defer></script>
</body>
</html>
